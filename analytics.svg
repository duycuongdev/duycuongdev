<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <style>
      @keyframes fade { from{opacity:0} to{opacity:1} }
      @keyframes glow { 0%,100%{filter:drop-shadow(0 0 3px #22d3ee55)} 50%{filter:drop-shadow(0 0 10px #22d3eeaa)} }
      .in{animation:fade .7s ease-out both}
      .heading-icon{animation:glow 3s ease-in-out infinite}
      .head{font-family:sans-serif;font-size:18px;font-weight:700;fill:#e6edf3}
      .muted{font-family:monospace;font-size:11px;fill:#8b9ab0}
      .title{font-family:sans-serif;font-size:14px;font-weight:700;fill:#22d3ee}
      .label{font-family:sans-serif;font-size:12px;fill:#8b9ab0}
      .value{font-family:monospace;font-size:13px;font-weight:700;fill:#e6edf3}
      .metric{font-family:sans-serif;font-size:12px;font-weight:700;fill:#cbd5e1}
      .small{font-family:monospace;font-size:10px;fill:#8b9ab0}
      .line{stroke:#202d42;stroke-width:1}
    </style>
  </defs>

  <rect width="900" height="410" rx="14" fill="url(#bg)"/>
  <rect x="42" y="22" width="36" height="36" rx="9" fill="#07333a" stroke="#0b6b72"/>
  <text x="60" y="46" text-anchor="middle" class="heading-icon" font-size="19" fill="#22d3ee">⌁</text>
  <text x="90" y="46" class="head">GitHub Analytics &amp; Activity</text>
  <text x="858" y="43" text-anchor="end" class="muted">Updated 2026-10-10</text>
  <line x1="42" y1="70" x2="858" y2="70" stroke="#1d2a3d"/>

  <g class="in">
    <rect x="42" y="88" width="816" height="320" rx="14" fill="url(#panel)" stroke="#202d42" stroke-width="1.2"/>
    <text x="70" y="126" class="title">◉ Duy Cường's GitHub Stats</text>

    <text x="70" y="161" class="label" fill="#facc15">☆</text><text x="92" y="161" class="label">Total Stars Earned:</text><text x="390" y="161" text-anchor="end" class="value">0</text>
    <line x1="70" y1="174" x2="390" y2="174" class="line"/>
    <text x="70" y="195" class="label" fill="#22d3ee">⌁</text><text x="92" y="195" class="label">Public Repositories:</text><text x="390" y="195" text-anchor="end" class="value">7</text>
    <line x1="70" y1="208" x2="390" y2="208" class="line"/>
    <text x="70" y="229" class="label" fill="#c084fc">♧</text><text x="92" y="229" class="label">Followers:</text><text x="390" y="229" text-anchor="end" class="value">0</text>
    <line x1="70" y1="242" x2="390" y2="242" class="line"/>
    <text x="70" y="263" class="label" fill="#fb7185">◎</text><text x="92" y="263" class="label">Following:</text><text x="390" y="263" text-anchor="end" class="value">1</text>
    <line x1="70" y1="276" x2="390" y2="276" class="line"/>
    <text x="70" y="297" class="label" fill="#34d399">◌</text><text x="92" y="297" class="label">Profile created:</text><text x="390" y="297" text-anchor="end" class="value">Dec 2023</text>

    <line x1="420" y1="140" x2="420" y2="300" stroke="#26344a"/>
    <circle cx="555" cy="218" r="67" fill="#111c2d" stroke="#243650" stroke-width="14"/>
    <path d="M 504 218 A 51 51 0 1 1 594 252" fill="none" stroke="#22d3ee" stroke-width="14" stroke-linecap="round"/>
    <text x="555" y="224" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#67e8f9">7</text>
    <text x="555" y="246" text-anchor="middle" class="small">PUBLIC REPOS</text>
    <text x="555" y="286" text-anchor="middle" class="muted">Profile activity</text>

    <line x1="660" y1="140" x2="660" y2="300" stroke="#26344a"/>
    <rect x="682" y="146" width="150" height="66" rx="12" fill="#111c2d" stroke="#243650"/>
    <text x="757" y="177" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#e879f9">7</text>
    <text x="757" y="197" text-anchor="middle" class="metric">Repositories</text>
    <rect x="682" y="226" width="150" height="66" rx="12" fill="#111c2d" stroke="#243650"/>
    <text x="757" y="257" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#22d3ee">0</text>
    <text x="757" y="277" text-anchor="middle" class="metric">Stars earned</text>

    <line x1="70" y1="320" x2="830" y2="320" class="line"/>
    <text x="70" y="346" class="metric">⌁ Most Used Languages</text>
    <text x="830" y="346" text-anchor="end" class="muted">Primary: JavaScript</text>
