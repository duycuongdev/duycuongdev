<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/><stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="bd" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>
    <style>
      @keyframes cardIn { 0%{opacity:0;transform:translateY(20px) scale(0.96)} 100%{opacity:1;transform:translateY(0) scale(1)} }
      @keyframes hdrGlow { 0%,100%{filter:drop-shadow(0 0 4px #e879f9aa)} 50%{filter:drop-shadow(0 0 14px #818cf8cc)} }
      @keyframes dotPulse { 0%,100%{r:3.5;opacity:0.8} 50%{r:5;opacity:1} }
      .card{animation:cardIn 0.65s cubic-bezier(.22,1,.36,1) both}
      .hdr{font-family:sans-serif;font-size:13px;font-weight:bold;fill:#e879f9;letter-spacing:2.5px;animation:hdrGlow 3s ease-in-out infinite}
      .ttl{font-family:sans-serif;font-size:14px;font-weight:bold;fill:#e6edf3}
      .dsc{font-family:sans-serif;font-size:11px;fill:#8b949e}
      .tag{font-family:monospace;font-size:10px;font-weight:bold}
      .badge{font-family:sans-serif;font-size:9px;fill:#8b949e}
      .dot{animation:dotPulse 2s ease-in-out infinite}
    </style>
  </defs>
  <rect width="900" height="250" rx="12" fill="url(#bg)"/>
  <rect width="900" height="250" rx="12" fill="none" stroke="url(#bd)" stroke-width="1.5"/>
  <text x="450" y="30" text-anchor="middle" class="hdr">&#x1F680; FEATURED PROJECTS</text>
  <line x1="50" y1="40" x2="850" y2="40" stroke="#1f2937" stroke-width="1"/>
  <g transform="translate(48,56)" class="card" style="animation-delay:0.10s">
    <rect width="254" height="164" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <rect width="254" height="3" rx="10" fill="#38bdf8" fill-opacity="0.5"/>
    <rect x="14" y="14" width="32" height="32" rx="8" fill="#38bdf8" fill-opacity="0.12"/>
    <text x="30" y="35" text-anchor="middle" font-size="16">&#x1F4CB;</text>
    <rect x="200" y="14" width="42" height="16" rx="8" fill="#1f2937"/>
    <text x="221" y="25.5" text-anchor="middle" class="badge">Clone</text>
    <text x="14" y="66" class="ttl">Trello Web &amp; API</text>
    <text x="14" y="85" class="dsc">Full-featured project management</text>
    <text x="14" y="100" class="dsc">app with drag-and-drop boards</text>
    <text x="14" y="115" class="dsc">and real-time collaboration.</text>
    <line x1="14" y1="130" x2="240" y2="130" stroke="#21262d" stroke-width="1"/>
    <circle class="dot" cx="18" cy="148" r="3.5" fill="#61DAFB" style="animation-delay:0s"/>
    <text x="28" y="151.5" class="tag" fill="#61DAFB">React</text>
    <circle cx="78" cy="148" r="3.5" fill="#F0DB4F"/>
    <text x="88" y="151.5" class="tag" fill="#F0DB4F">Node.js</text>
    <circle cx="148" cy="148" r="3.5" fill="#4A9EFF"/>
    <text x="158" y="151.5" class="tag" fill="#4A9EFF">MongoDB</text>
  </g>
  <g transform="translate(323,56)" class="card" style="animation-delay:0.25s">
    <rect width="254" height="164" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <rect width="254" height="3" rx="10" fill="#42b883" fill-opacity="0.5"/>
    <rect x="14" y="14" width="32" height="32" rx="8" fill="#42b883" fill-opacity="0.12"/>
    <text x="30" y="35" text-anchor="middle" font-size="16">&#x1F41F;</text>
    <rect x="196" y="14" width="46" height="16" rx="8" fill="#1f2937"/>
    <text x="219" y="25.5" text-anchor="middle" class="badge">System</text>
    <text x="14" y="66" class="ttl">AquaLife Web &amp; API</text>
    <text x="14" y="85" class="dsc">Automated aquarium management</text>
    <text x="14" y="100" class="dsc">system for monitoring water</text>
    <text x="14" y="115" class="dsc">parameters and analytics.</text>
    <line x1="14" y1="130" x2="240" y2="130" stroke="#21262d" stroke-width="1"/>
    <circle class="dot" cx="18" cy="148" r="3.5" fill="#339933" style="animation-delay:0.3s"/>
    <text x="28" y="151.5" class="tag" fill="#339933">Node.js</text>
    <circle cx="90" cy="148" r="3.5" fill="#47A248"/>
    <text x="100" y="151.5" class="tag" fill="#47A248">MongoDB</text>
    <circle cx="170" cy="148" r="3.5" fill="#3178c6"/>
    <text x="180" y="151.5" class="tag" fill="#3178c6">Socket.io</text>
  </g>

  <g transform="translate(598,56)" class="card" style="animation-delay:0.40s">
    <rect width="254" height="164" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <rect width="254" height="3" rx="10" fill="#e879f9" fill-opacity="0.5"/>
    <rect x="14" y="14" width="32" height="32" rx="8" fill="#e879f9" fill-opacity="0.12"/>
    <text x="30" y="35" text-anchor="middle" font-size="16">&#x1F3B5;</text>
    <rect x="210" y="14" width="32" height="16" rx="8" fill="#1f2937"/>
    <text x="226" y="25.5" text-anchor="middle" class="badge">Tool</text>
    <text x="14" y="66" class="ttl">TikTok Downloader</text>
    <text x="14" y="85" class="dsc">High-speed video downloading</text>
    <text x="14" y="100" class="dsc">tool and media scraper with</text>
    <text x="14" y="115" class="dsc">batch extraction support.</text>
    <line x1="14" y1="130" x2="240" y2="130" stroke="#21262d" stroke-width="1"/>
    <circle class="dot" cx="18" cy="148" r="3.5" fill="#3178c6" style="animation-delay:0.6s"/>
    <text x="28" y="151.5" class="tag" fill="#3178c6">TypeScript</text>
    <circle cx="106" cy="148" r="3.5" fill="#339933"/>
    <text x="116" y="151.5" class="tag" fill="#339933">Node.js</text>
    <circle cx="168" cy="148" r="3.5" fill="#e879f9"/>
    <text x="178" y="151.5" class="tag" fill="#e879f9">Scraper</text>
  </g>
</svg>
