<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/><stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="bd" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>
    <style>
      @keyframes cardIn { 0%{opacity:0} 100%{opacity:1} }
      @keyframes hdrGlow { 0%,100%{filter:drop-shadow(0 0 4px #818cf866)} 50%{filter:drop-shadow(0 0 12px #818cf8cc)} }
      @keyframes dotPulse { 0%,100%{r:3.5;opacity:0.8} 50%{r:5;opacity:1} }
      @keyframes borderPulse { 0%,100%{stroke:#263044} 50%{stroke:#35415b} }
      .card{animation:cardIn 0.65s cubic-bezier(.22,1,.36,1) both}
      .hdr{font-family:sans-serif;font-size:20px;font-weight:700;fill:#e6edf3;animation:hdrGlow 3s ease-in-out infinite}
      .count{font-family:monospace;font-size:12px;fill:#8b949e}
      .ttl{font-family:sans-serif;font-size:16px;font-weight:bold;fill:#e6edf3}
      .dsc{font-family:sans-serif;font-size:12px;fill:#8b9ab0}
      .tag{font-family:monospace;font-size:11px;font-weight:bold}
      .badge{font-family:monospace;font-size:10px;fill:#8b9ab0}
      .dot{animation:dotPulse 2s ease-in-out infinite}
      .card-bg{animation:borderPulse 3s ease-in-out infinite}
    </style>
  </defs>
  <rect width="900" height="300" rx="12" fill="url(#bg)"/>
  <rect x="50" y="22" width="36" height="36" rx="9" fill="#171742" stroke="#34347d" stroke-width="1"/>
  <text x="68" y="46" text-anchor="middle" font-size="18">&#x1F680;</text>
  <text x="100" y="48" class="hdr">Featured Projects</text>
  <text x="850" y="45" text-anchor="end" class="count">3 public repositories</text>
  <line x1="50" y1="70" x2="850" y2="70" stroke="#263044" stroke-width="1"/>
  <g transform="translate(50,88)" class="card" style="animation-delay:0.10s">
    <rect class="card-bg" width="260" height="200" rx="13" fill="#101725" stroke="#263044" stroke-width="1.2"/>
    <rect width="260" height="3" rx="13" fill="#38bdf8" fill-opacity="0.5"/>
    <rect x="18" y="18" width="34" height="34" rx="9" fill="#1671d8" fill-opacity="0.14" stroke="#1671d8" stroke-opacity=".5"/>
    <text x="35" y="42" text-anchor="middle" font-size="17">&#x1F4CB;</text>
    <rect x="204" y="20" width="40" height="18" rx="9" fill="#263044"/>
    <text x="224" y="32.5" text-anchor="middle" class="badge">Clone</text>
    <text x="18" y="80" class="ttl">Trello_Web &amp; API</text>
    <text x="18" y="106" class="dsc">Full-featured project and workflow</text>
    <text x="18" y="124" class="dsc">management app clone with interactive drag-</text>
    <text x="18" y="142" class="dsc">and-drop boards and workspace collaboration.</text>
    <line x1="18" y1="158" x2="242" y2="158" stroke="#202b3d" stroke-width="1"/>
    <circle class="dot" cx="22" cy="178" r="3.5" fill="#22d3ee"/>
    <text x="34" y="182" class="tag" fill="#b8c4d6">React</text>
    <text x="75" y="182" class="tag" fill="#536174">·</text>
    <text x="88" y="182" class="tag" fill="#b8c4d6">REST API</text>
  </g>
  <g transform="translate(320,88)" class="card" style="animation-delay:0.25s">
    <rect class="card-bg" width="260" height="200" rx="13" fill="#101725" stroke="#263044" stroke-width="1.2"/>
    <rect width="260" height="3" rx="13" fill="#13c9bd" fill-opacity="0.5"/>
    <rect x="18" y="18" width="34" height="34" rx="9" fill="#13c9bd" fill-opacity="0.12" stroke="#13c9bd" stroke-opacity=".5"/>
    <text x="35" y="42" text-anchor="middle" font-size="17">&#x1F41F;</text>
    <rect x="202" y="20" width="42" height="18" rx="9" fill="#263044"/>
    <text x="223" y="32.5" text-anchor="middle" class="badge">System</text>
    <text x="18" y="80" class="ttl">AquaLife Web &amp; API</text>
    <text x="18" y="106" class="dsc">MERN e-commerce platform for</text>
    <text x="18" y="124" class="dsc">aquarium life, fish and aquatic</text>
    <text x="18" y="142" class="dsc">accessories.</text>
    <line x1="18" y1="158" x2="242" y2="158" stroke="#202b3d" stroke-width="1"/>
    <circle class="dot" cx="22" cy="178" r="3.5" fill="#2dd4bf"/>
    <text x="34" y="182" class="tag" fill="#b8c4d6">Node.js</text>
    <text x="88" y="182" class="tag" fill="#536174">·</text>
    <text x="101" y="182" class="tag" fill="#b8c4d6">MongoDB</text>
  </g>

  <g transform="translate(590,88)" class="card" style="animation-delay:0.40s">
    <rect class="card-bg" width="260" height="200" rx="13" fill="#101725" stroke="#263044" stroke-width="1.2"/>
    <rect width="260" height="3" rx="13" fill="#f04b72" fill-opacity="0.5"/>
    <rect x="18" y="18" width="34" height="34" rx="9" fill="#f04b72" fill-opacity="0.12" stroke="#f04b72" stroke-opacity=".5"/>
    <text x="35" y="42" text-anchor="middle" font-size="17">&#x1F3B5;</text>
    <rect x="212" y="20" width="32" height="18" rx="9" fill="#263044"/>
    <text x="228" y="32.5" text-anchor="middle" class="badge">Tool</text>
    <text x="18" y="80" class="ttl">TikTok Downloader</text>
    <text x="18" y="106" class="dsc">High-speed video downloading tool</text>
    <text x="18" y="124" class="dsc">and media scraper supporting</text>
    <text x="18" y="142" class="dsc">watermark removal and batch audio.</text>
    <line x1="18" y1="158" x2="242" y2="158" stroke="#202b3d" stroke-width="1"/>
    <circle class="dot" cx="22" cy="178" r="3.5" fill="#60a5fa"/>
    <text x="34" y="182" class="tag" fill="#b8c4d6">TypeScript</text>
    <text x="100" y="182" class="tag" fill="#536174">·</text>
    <text x="113" y="182" class="tag" fill="#b8c4d6">Scraper</text>
  </g>
</svg>
