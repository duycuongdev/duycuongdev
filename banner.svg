      <line x1="0" y1="252" x2="900" y2="252"/><line x1="0" y1="336" x2="900" y2="336"/>
      <line x1="150" y1="0" x2="150" y2="420"/><line x1="300" y1="0" x2="300" y2="420"/>
      <line x1="450" y1="0" x2="450" y2="420"/><line x1="600" y1="0" x2="600" y2="420"/>
      <line x1="750" y1="0" x2="750" y2="420"/>
    </g>
    <!-- Twinkling stars -->
    <g fill="#ffffff">
      <circle cx="42" cy="28" r="1.2"><animate attributeName="opacity" values="0;1;0" dur="2.3s" begin="0.1s" repeatCount="indefinite"/></circle>
      <circle cx="130" cy="55" r="1.0"><animate attributeName="opacity" values="0;1;0" dur="3.1s" begin="0.7s" repeatCount="indefinite"/></circle>
      <circle cx="220" cy="18" r="1.4"><animate attributeName="opacity" values="0;0.8;0" dur="1.9s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="340" cy="40" r="0.9"><animate attributeName="opacity" values="0;1;0" dur="2.7s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="480" cy="22" r="1.1"><animate attributeName="opacity" values="0;0.9;0" dur="3.5s" begin="0.9s" repeatCount="indefinite"/></circle>
      <circle cx="600" cy="14" r="1.3"><animate attributeName="opacity" values="0;1;0" dur="2.1s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="38" r="1.0"><animate attributeName="opacity" values="0;0.7;0" dur="2.8s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="810" cy="20" r="1.2"><animate attributeName="opacity" values="0;1;0" dur="3.3s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="865" cy="60" r="0.8"><animate attributeName="opacity" values="0;0.9;0" dur="1.7s" begin="0.2s" repeatCount="indefinite"/></circle>
      <circle cx="75" cy="380" r="1.0"><animate attributeName="opacity" values="0;1;0" dur="2.5s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="870" cy="370" r="1.1"><animate attributeName="opacity" values="0;0.8;0" dur="3.0s" begin="1.4s" repeatCount="indefinite"/></circle>
    </g>
    <!-- Code tag div: no space inside brackets -->
    <text x="450" y="80" text-anchor="middle" font-family="'Courier New',monospace" font-size="16" opacity="0">
      <animate attributeName="opacity" values="0;1;1" dur="0.8s" fill="freeze" begin="0.5s"/>
      <animateTransform attributeName="transform" type="translate" values="0,10;0,0;0,0" dur="0.8s" fill="freeze" begin="0.5s"/>
      <tspan fill="#475569">&lt;</tspan><tspan fill="#38bdf8">div</tspan><tspan fill="#475569">&gt;</tspan><tspan fill="#e2e8f0"> Hello there, </tspan><tspan fill="#475569">&lt;/</tspan><tspan fill="#38bdf8">div</tspan><tspan fill="#475569">&gt;</tspan>
    </text>
    <!-- Main name with float-in -->
    <text x="450" y="145" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-weight="800" font-size="52" fill="url(#nameGrad)" filter="url(#ns)" opacity="0">
      <animate attributeName="opacity" values="0;1;1" dur="1s" fill="freeze" begin="1s"/>
      <animateTransform attributeName="transform" type="translate" values="0,15;0,0;0,0" dur="1s" fill="freeze" begin="1s"/>
      I'm <tspan fill="#ffffff">Duy Cuong</tspan> Dev
    </text>
    <!-- Subtitle -->
    <text x="450" y="175" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="16.5" fill="url(#subGrad)" letter-spacing="3" opacity="0">
      <animate attributeName="opacity" values="0;0.85;0.85" dur="0.8s" fill="freeze" begin="1.6s"/>
      <animateTransform attributeName="transform" type="translate" values="0,8;0,0;0,0" dur="0.8s" fill="freeze" begin="1.6s"/>
      Full Stack Developer
    </text>
    <!-- Tech Stack comment -->
    <text x="155" y="240" font-family="'Courier New',monospace" font-size="11" fill="#475569" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0.7" dur="0.5s" fill="freeze" begin="2s"/>
