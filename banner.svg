<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="80" height="35" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 35" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.15"/>
    </pattern>
    <style>
      @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
      .float-anim { animation: float 3s ease-in-out infinite; }
      .code-txt { opacity: 0.12; font-family: 'Courier New', monospace; font-size: 10px; }
      .btn-txt { font-family: -apple-system, sans-serif; font-size: 13px; font-weight: 600; }
    </style>
  </defs>

  <rect width="900" height="280" rx="14" fill="url(#bgGrad)"/>
  <rect width="900" height="280" rx="14" fill="url(#grid)"/>
  <rect width="900" height="280" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <text x="18" y="40" class="code-txt" fill="#38bdf8">01101000<tspan x="18" y="55">00110100</tspan><tspan x="18" y="70">11001010</tspan><tspan x="18" y="85">01010110</tspan><tspan x="18" y="100">10110001</tspan></text>
  <text x="810" y="40" class="code-txt" fill="#e879f9">10010110<tspan x="810" y="55">01101001</tspan><tspan x="810" y="70">00110100</tspan><tspan x="810" y="85">11011010</tspan><tspan x="810" y="100">01001101</tspan></text>

  <ellipse cx="250" cy="140" rx="120" ry="80" fill="#38bdf8" fill-opacity="0.04"/>
  <ellipse cx="650" cy="140" rx="120" ry="80" fill="#e879f9" fill-opacity="0.04"/>

  <g transform="translate(0, 0)">
    <g class="float-anim">
      <text x="450" y="92" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" fill="#6b7280" letter-spacing="1">
        <tspan fill="#38bdf8" font-weight="bold">&lt;div&gt;</tspan>
        <tspan fill="#e6edf3" dx="6">Hello there,</tspan>
        <tspan fill="#38bdf8" font-weight="bold" dx="6">&lt;/div&gt;</tspan>
      </text>
      <text x="450" y="158" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
        <tspan fill="#ffffff">I'm </tspan><tspan fill="url(#nameGrad)" filter="url(#softglow)">Duy Cuong Dev</tspan>
      </text>
      <text x="450" y="188" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#6b7280" letter-spacing="3">✦ FULL STACK DEVELOPER ✦</text>
    </g>

    <g transform="translate(263, 210)">
      <rect width="110" height="34" rx="17" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
      <path transform="translate(14, 8) scale(0.75)" d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z" fill="#e6edf3"/>
      <text x="40" y="22" class="btn-txt" fill="#e6edf3">GitHub</text>
    </g>

    <g transform="translate(385, 210)">
      <rect width="120" height="34" rx="17" fill="#18191c" stroke="#3a3b3c" stroke-width="1.2"/>
      <path transform="translate(14, 7) scale(0.85)" d="M12 2.04C6.5 2.04 2 6.53 2 12.06C2 17.06 5.66 21.21 10.44 21.96V14.96H7.9V12.06H10.44V9.85C10.44 7.34 11.93 5.96 14.22 5.96C15.31 5.96 16.45 6.15 16.45 6.15V8.62H15.19C13.95 8.62 13.56 9.39 13.56 10.18V12.06H16.34L15.89 14.96H13.56V21.96A10 10 0 0 0 22 12.06C22 6.53 17.5 2.04 12 2.04Z" fill="#818cf8"/>
      <text x="40" y="22" class="btn-txt" fill="#c9d1d9">Facebook</text>
    </g>

    <g transform="translate(517, 210)">
      <rect width="120" height="34" rx="17" fill="#1a1a2e" stroke="#502844" stroke-width="1.2"/>
      <rect transform="translate(13, 8)" width="14" height="14" rx="4" fill="none" stroke="#e879f9" stroke-width="1.5"/>
      <circle cx="20" cy="15" r="3.5" fill="none" stroke="#e879f9" stroke-width="1.3"/>
      <circle cx="25.5" cy="9.5" r="1" fill="#e879f9"/>
      <text x="40" y="22" class="btn-txt" fill="#fbcfe8">Instagram</text>
    </g>
  </g>
</svg>