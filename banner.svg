      <animateTransform attributeName="transform" type="translate" values="0,10;0,0;0,0" dur="0.7s" fill="freeze" begin="2.2s"/>
      <rect x="155" y="248" width="54" height="26" rx="13" fill="#1e40af" opacity="0.20"/><rect x="155" y="248" width="54" height="26" rx="13" fill="none" stroke="#3b82f6" stroke-width="0.8" opacity="0.60"/>
      <text x="182" y="265" text-anchor="middle" fill="#93c5fd">HTML</text>
      <rect x="218" y="248" width="46" height="26" rx="13" fill="#1e40af" opacity="0.20"/><rect x="218" y="248" width="46" height="26" rx="13" fill="none" stroke="#3b82f6" stroke-width="0.8" opacity="0.60"/>
      <text x="241" y="265" text-anchor="middle" fill="#93c5fd">CSS</text>
      <rect x="273" y="248" width="62" height="26" rx="13" fill="#713f12" opacity="0.20"/><rect x="273" y="248" width="62" height="26" rx="13" fill="none" stroke="#f59e0b" stroke-width="0.8" opacity="0.55"/>
      <text x="304" y="265" text-anchor="middle" fill="#fde68a">JS</text>
      <rect x="344" y="248" width="74" height="26" rx="13" fill="#1e3a8a" opacity="0.20"/><rect x="344" y="248" width="74" height="26" rx="13" fill="none" stroke="#60a5fa" stroke-width="0.8" opacity="0.55"/>
      <text x="381" y="265" text-anchor="middle" fill="#bfdbfe">TypeScript</text>
      <rect x="427" y="248" width="56" height="26" rx="13" fill="#0c4a6e" opacity="0.20"/><rect x="427" y="248" width="56" height="26" rx="13" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.55"/>
      <text x="455" y="265" text-anchor="middle" fill="#7dd3fc">React</text>
      <rect x="492" y="248" width="74" height="26" rx="13" fill="#14532d" opacity="0.20"/><rect x="492" y="248" width="74" height="26" rx="13" fill="none" stroke="#22c55e" stroke-width="0.8" opacity="0.55"/>
      <text x="529" y="265" text-anchor="middle" fill="#86efac">Node.js</text>
      <rect x="575" y="248" width="74" height="26" rx="13" fill="#14532d" opacity="0.20"/><rect x="575" y="248" width="74" height="26" rx="13" fill="none" stroke="#22c55e" stroke-width="0.8" opacity="0.55"/>
      <text x="612" y="265" text-anchor="middle" fill="#86efac">Express</text>
      <rect x="658" y="248" width="84" height="26" rx="13" fill="#14532d" opacity="0.12"/><rect x="658" y="248" width="84" height="26" rx="13" fill="none" stroke="#16a34a" stroke-width="0.8" opacity="0.55"/>
      <text x="700" y="265" text-anchor="middle" fill="#6ee7b7">MongoDB</text>
      <rect x="751" y="248" width="48" height="26" rx="13" fill="#431407" opacity="0.20"/><rect x="751" y="248" width="48" height="26" rx="13" fill="none" stroke="#f97316" stroke-width="0.8" opacity="0.55"/>
      <text x="775" y="265" text-anchor="middle" fill="#fdba74">Git</text>
    </g>

    <!-- Project card 1 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1" dur="0.6s" fill="freeze" begin="2.8s"/>
      <animateTransform attributeName="transform" type="translate" values="0,14;0,0;0,0" dur="0.6s" fill="freeze" begin="2.8s"/>
      <rect x="115" y="295" width="200" height="60" rx="10" fill="#0d1117" opacity="0.80"/>
      <rect x="115" y="295" width="200" height="60" rx="10" fill="none" stroke="#2f80ed" stroke-width="0.8" opacity="0.45"/>
      <text x="215" y="314" text-anchor="middle" font-family="'Courier New',monospace" font-size="11.5" fill="#60a5fa">&#128203; Trello_Web &amp; API</text>
      <text x="215" y="331" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#64748b">React, JavaScript, REST API</text>
      <text x="215" y="346" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#475569">Project management app clone</text>
    </g>
    <!-- Project card 2 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1" dur="0.6s" fill="freeze" begin="3.1s"/>
      <animateTransform attributeName="transform" type="translate" values="0,14;0,0;0,0" dur="0.6s" fill="freeze" begin="3.1s"/>
      <rect x="328" y="295" width="200" height="60" rx="10" fill="#0d1117" opacity="0.80"/>
      <rect x="328" y="295" width="200" height="60" rx="10" fill="none" stroke="#7c3aed" stroke-width="0.8" opacity="0.45"/>
      <text x="428" y="314" text-anchor="middle" font-family="'Courier New',monospace" font-size="11.5" fill="#a78bfa">&#128032; AquaLife Web &amp; API</text>
      <text x="428" y="331" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#64748b">JavaScript, Node.js, MongoDB</text>
      <text x="428" y="346" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#475569">Aquarium management system</text>
    </g>
    <!-- Project card 3 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1" dur="0.6s" fill="freeze" begin="3.4s"/>
      <animateTransform attributeName="transform" type="translate" values="0,14;0,0;0,0" dur="0.6s" fill="freeze" begin="3.4s"/>
      <rect x="541" y="295" width="200" height="60" rx="10" fill="#0d1117" opacity="0.80"/>
      <rect x="541" y="295" width="200" height="60" rx="10" fill="none" stroke="#0891b2" stroke-width="0.8" opacity="0.45"/>
      <text x="641" y="314" text-anchor="middle" font-family="'Courier New',monospace" font-size="11.5" fill="#38bdf8">&#127925; TikTok Downloader</text>
      <text x="641" y="331" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#64748b">TypeScript, Web Scraping</text>
      <text x="641" y="346" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#475569">Video download tool</text>
    </g>
    <!-- Info row -->
    <text x="450" y="388" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#64748b" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0.7" dur="0.6s" fill="freeze" begin="3.7s"/>
      &#128205; Vietnam  ·  &#127760; github.com/duycuongdev  ·  &#128188; Open to work
    </text>
    <!-- Top and bottom borders -->
    <rect x="0" y="0" width="900" height="4" fill="url(#bdr)" rx="1"><animate attributeName="opacity" values="0.6;1;0.6" dur="3.2s" repeatCount="indefinite"/></rect>
    <rect x="0" y="416" width="900" height="4" fill="url(#bdr)" rx="1"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.8s" repeatCount="indefinite"/></rect>
    <!-- Corner accents -->
    <path d="M0,36 L0,0 L36,0" fill="none" stroke="#2f80ed" stroke-width="2" opacity="0.7"/>
    <path d="M864,0 L900,0 L900,36" fill="none" stroke="#7c3aed" stroke-width="2" opacity="0.7"/>
    <path d="M0,384 L0,420 L36,420" fill="none" stroke="#7c3aed" stroke-width="2" opacity="0.7"/>
    <path d="M864,420 L900,420 L900,384" fill="none" stroke="#2f80ed" stroke-width="2" opacity="0.7"/>
    <circle cx="0" cy="0" r="4" fill="#2f80ed" opacity="0.9"/>
    <circle cx="900" cy="0" r="4" fill="#7c3aed" opacity="0.9"/>
    <circle cx="0" cy="420" r="4" fill="#7c3aed" opacity="0.9"/>
    <circle cx="900" cy="420" r="4" fill="#2f80ed" opacity="0.9"/>
    <!-- Scan line -->
    <rect x="0" y="-100" width="900" height="100" fill="url(#scan)"><animateTransform attributeName="transform" type="translate" values="0,0;0,520" dur="5s" repeatCount="indefinite"/></rect>
  </g>
</svg>

