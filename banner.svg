<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Duy Cuong Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060a14"/><stop offset="40%" stop-color="#0d1117"/><stop offset="100%" stop-color="#0a0820"/>
    </linearGradient>
    <radialGradient id="a1" cx="20%" cy="35%" r="60%"><stop offset="0%" stop-color="#2f80ed" stop-opacity="0.40"/><stop offset="100%" stop-color="#2f80ed" stop-opacity="0"/></radialGradient>
    <radialGradient id="a2" cx="80%" cy="65%" r="55%"><stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/><stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <radialGradient id="a3" cx="55%" cy="15%" r="50%"><stop offset="0%" stop-color="#0891b2" stop-opacity="0.25"/><stop offset="100%" stop-color="#0891b2" stop-opacity="0"/></radialGradient>
    <radialGradient id="a4" cx="50%" cy="92%" r="42%"><stop offset="0%" stop-color="#059669" stop-opacity="0.15"/><stop offset="100%" stop-color="#059669" stop-opacity="0"/></radialGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/><stop offset="35%" stop-color="#a78bfa"/><stop offset="65%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#818cf8"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7dd3fc"/><stop offset="50%" stop-color="#e2e8f0"/><stop offset="100%" stop-color="#7dd3fc"/></linearGradient>
    <linearGradient id="bdr" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#2f80ed" stop-opacity="0"/><stop offset="25%" stop-color="#2f80ed" stop-opacity="1"/><stop offset="75%" stop-color="#7c3aed" stop-opacity="1"/><stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/></linearGradient>
    <linearGradient id="scan" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#2f80ed" stop-opacity="0"/><stop offset="50%" stop-color="#2f80ed" stop-opacity="0.10"/><stop offset="100%" stop-color="#2f80ed" stop-opacity="0"/></linearGradient>
    <filter id="sg" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="stg" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="ns" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#2f80ed" flood-opacity="0.65"/></filter>
    <clipPath id="fr"><rect width="900" height="420" rx="18" ry="18"/></clipPath>
  </defs>
  <g clip-path="url(#fr)">
    <rect width="900" height="420" fill="url(#bgGrad)"/>
    <ellipse cx="180" cy="160" rx="380" ry="220" fill="url(#a1)"><animate attributeName="cx" values="180;270;180" dur="10s" repeatCount="indefinite"/><animate attributeName="cy" values="160;130;160" dur="8s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="720" cy="260" rx="330" ry="200" fill="url(#a2)"><animate attributeName="cx" values="720;650;720" dur="11s" repeatCount="indefinite"/><animate attributeName="cy" values="260;290;260" dur="9s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="450" cy="70" rx="300" ry="150" fill="url(#a3)"><animate attributeName="ry" values="150;190;150" dur="7s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="450" cy="395" rx="350" ry="110" fill="url(#a4)"><animate attributeName="rx" values="350;400;350" dur="9s" repeatCount="indefinite"/></ellipse>
    <g stroke="#2f80ed" stroke-width="0.5" opacity="0.07">
