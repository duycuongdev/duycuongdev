<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <style>
      @keyframes fadeIn { 0%{opacity:0} 100%{opacity:1} }
      @keyframes glow { 0%,100%{filter:drop-shadow(0 0 3px #22d3ee55)} 50%{filter:drop-shadow(0 0 10px #22d3eeaa)} }
      @keyframes pulse { 0%,100%{opacity:.72} 50%{opacity:1} }
      .in{animation:fadeIn .55s ease-out both}
      .head{font-family:sans-serif;font-size:17px;font-weight:700;fill:#e6edf3}
      .muted{font-family:monospace;font-size:11px;fill:#8b9ab0}
      .section{font-family:sans-serif;font-size:13px;font-weight:700;fill:#dbe4f0;letter-spacing:.2px}
      .chip{fill:#0d1728;stroke:#1e2b44;stroke-width:1}
      .chiptext{font-family:sans-serif;font-size:11px;font-weight:600;fill:#cbd5e1}
      .icon{font-family:monospace;font-size:11px;font-weight:700}
      .count{font-family:monospace;font-size:10px;fill:#12d6d0}
      .pulse{animation:pulse 3s ease-in-out infinite}
      .heading-icon{animation:glow 3s ease-in-out infinite}
    </style>
  </defs>

  <rect width="900" height="500" rx="14" fill="url(#bg)"/>
  <rect x="42" y="22" width="36" height="36" rx="9" fill="#07333a" stroke="#0b6b72"/>
  <text x="60" y="46" text-anchor="middle" class="icon heading-icon" fill="#22d3ee">&lt;/&gt;</text>
  <text x="90" y="46" class="head">Skills &amp; Tech Stack</text>
  <text x="858" y="43" text-anchor="end" class="muted">Modern Ecosystem</text>
  <line x1="42" y1="70" x2="858" y2="70" stroke="#1d2a3d"/>

  <g class="in" style="animation-delay:.1s">
    <rect x="42" y="88" width="816" height="160" rx="14" fill="url(#panel)" stroke="#202d42" stroke-width="1.2"/>
    <circle cx="66" cy="116" r="4" fill="#22d3ee"/>
    <text x="78" y="121" class="section">CORE TECHNOLOGIES &amp; SKILLS</text>
    <rect x="700" y="108" width="138" height="24" rx="12" fill="#0b3441" stroke="#087486"/>
    <text x="714" y="124" class="count">13 Technologies</text>
    <line x1="62" y1="145" x2="838" y2="145" stroke="#1d2a3d"/>

    <g transform="translate(62,159)">
      <rect class="chip" width="92" height="34" rx="10"/><text x="12" y="22" class="icon" fill="#f0db4f">JS</text><text x="34" y="22" class="chiptext">JavaScript</text>
      <rect class="chip" x="102" width="96" height="34" rx="10"/><text x="114" y="22" class="icon" fill="#3178c6">TS</text><text x="136" y="22" class="chiptext">TypeScript</text>
      <rect class="chip" x="208" width="174" height="34" rx="10"/><text x="220" y="22" class="icon" fill="#c084fc">ƒ</text><text x="242" y="16" class="chiptext">Data Structures &amp;</text><text x="242" y="29" class="chiptext">Algorithms</text>
      <rect class="chip" x="392" width="88" height="34" rx="10"/><text x="404" y="22" class="icon" fill="#22d3ee">⚛</text><text x="426" y="22" class="chiptext">ReactJS</text>
      <rect class="chip" x="490" width="80" height="34" rx="10"/><text x="502" y="22" class="icon" fill="#22c55e">⬡</text><text x="524" y="22" class="chiptext">NodeJS</text>
      <rect class="chip" x="580" width="92" height="34" rx="10"/><text x="592" y="22" class="icon" fill="#dbeafe">ex</text><text x="614" y="22" class="chiptext">ExpressJS</text>
    </g>
    <g transform="translate(62,201)">
      <rect class="chip" width="92" height="34" rx="10"/><text x="12" y="22" class="icon" fill="#22c55e">◒</text><text x="34" y="22" class="chiptext">MongoDB</text>
      <rect class="chip" x="102" width="84" height="34" rx="10"/><text x="114" y="22" class="icon" fill="#f97316">5</text><text x="136" y="22" class="chiptext">HTML5</text>
      <rect class="chip" x="196" width="84" height="34" rx="10"/><text x="208" y="22" class="icon" fill="#3b82f6">3</text><text x="230" y="22" class="chiptext">CSS3</text>
      <rect class="chip" x="290" width="108" height="34" rx="10"/><text x="302" y="22" class="icon" fill="#22d3ee">~</text><text x="324" y="16" class="chiptext">Tailwind</text><text x="324" y="29" class="chiptext">CSS</text>
      <rect class="chip" x="408" width="108" height="34" rx="10"/><text x="420" y="22" class="icon" fill="#60a5fa">M</text><text x="442" y="16" class="chiptext">Material</text><text x="442" y="29" class="chiptext">UI</text>
      <rect class="chip" x="526" width="110" height="34" rx="10"/><text x="538" y="22" class="icon" fill="#e2e8f0">●</text><text x="560" y="16" class="chiptext">Git &amp;</text><text x="560" y="29" class="chiptext">GitHub</text>
      <rect class="chip" x="646" width="78" height="34" rx="10"/><text x="658" y="22" class="icon" fill="#60a5fa">▣</text><text x="680" y="22" class="chiptext">Trello</text>
    </g>
  </g>

  <g class="in" style="animation-delay:.25s">
    <rect x="42" y="268" width="816" height="210" rx="14" fill="url(#panel)" stroke="#202d42" stroke-width="1.2"/>
    <circle cx="66" cy="296" r="4" fill="#34d399"/>
    <text x="78" y="301" class="section">CORE ENGINEERING ABILITIES</text>
    <rect x="700" y="288" width="138" height="24" rx="12" fill="#0d3939" stroke="#087466"/>
    <text x="714" y="304" class="count">11 Competencies</text>
    <line x1="62" y1="325" x2="838" y2="325" stroke="#1d2a3d"/>

    <g transform="translate(62,339)">
      <rect class="chip" width="190" height="36" rx="10"/><text x="14" y="24" class="icon" fill="#22d3ee">&lt;/&gt;</text><text x="42" y="24" class="chiptext">Frontend Dev</text>
      <rect class="chip" x="202" width="190" height="36" rx="10"/><text x="216" y="24" class="icon" fill="#22c55e">⬡</text><text x="244" y="24" class="chiptext">Backend Dev</text>
      <rect class="chip" x="404" width="190" height="36" rx="10"/><text x="418" y="24" class="icon" fill="#60a5fa">▤</text><text x="446" y="24" class="chiptext">Database Design</text>
      <rect class="chip" x="606" width="190" height="36" rx="10"/><text x="620" y="24" class="icon" fill="#818cf8">♆</text><text x="648" y="24" class="chiptext">System Architecture</text>
    </g>
    <g transform="translate(62,385)">
      <rect class="chip" width="190" height="36" rx="10"/><text x="14" y="24" class="icon" fill="#fb7185">ϟ</text><text x="42" y="24" class="chiptext">Unit Testing</text>
      <rect class="chip" x="202" width="190" height="36" rx="10"/><text x="216" y="24" class="icon" fill="#34d399">▣</text><text x="244" y="24" class="chiptext">Web Security</text>
      <rect class="chip" x="404" width="190" height="36" rx="10"/><text x="418" y="24" class="icon" fill="#facc15">↗</text><text x="446" y="24" class="chiptext">API Integration</text>
      <rect class="chip" x="606" width="190" height="36" rx="10"/><text x="620" y="24" class="icon" fill="#f97316">◆</text><text x="648" y="24" class="chiptext">Git &amp; Version Control</text>
    </g>
    <g transform="translate(62,425)">
      <rect class="chip" width="190" height="36" rx="10"/><text x="14" y="24" class="icon" fill="#22d3ee">⌁</text><text x="42" y="24" class="chiptext">Responsive Layout</text>
      <rect class="chip" x="202" width="190" height="36" rx="10"/><text x="216" y="24" class="icon" fill="#22d3ee">⚑</text><text x="244" y="24" class="chiptext">CI/CD Automation</text>
      <rect class="chip" x="404" width="190" height="36" rx="10"/><text x="418" y="24" class="icon" fill="#c084fc">&gt;_</text><text x="446" y="24" class="chiptext">Code Refactoring</text>
    </g>
  </g>
</svg>
