<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/><stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="bd" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0.6"/>
    </linearGradient>
    <style>
      @keyframes popIn { 0%{opacity:0;transform:scale(0.7) translateY(12px)} 80%{transform:scale(1.05) translateY(-2px)} 100%{opacity:1;transform:scale(1) translateY(0)} }
      @keyframes hg { 0%,100%{filter:drop-shadow(0 0 4px #38bdf8aa)} 50%{filter:drop-shadow(0 0 12px #818cf8cc)} }
      .ic{animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both}
      .lbl{font-family:sans-serif;font-size:10px;fill:#8b949e;text-anchor:middle}
      .hdr{font-family:sans-serif;font-size:13px;font-weight:bold;fill:#38bdf8;letter-spacing:2.5px;animation:hg 3s ease-in-out infinite}
      .t{font-family:monospace;font-size:11px;font-weight:bold;text-anchor:middle}
    </style>
  </defs>
  <rect width="900" height="200" rx="12" fill="url(#bg)"/>
  <rect width="900" height="200" rx="12" fill="none" stroke="url(#bd)" stroke-width="1.5"/>
  <text x="450" y="29" text-anchor="middle" class="hdr">&#x26A1; TECH STACK</text>
  <line x1="50" y1="39" x2="850" y2="39" stroke="#1f2937" stroke-width="1"/>
  <g transform="translate(42,50)"  class="ic" style="animation-delay:.05s"><rect width="48" height="48" rx="10" fill="#F0DB4F" fill-opacity=".12" stroke="#F0DB4F" stroke-opacity=".4" stroke-width="1"/><text x="24" y="31" class="t" fill="#F0DB4F">JS</text></g>
  <text x="66" y="114" class="lbl">JavaScript</text>
  <g transform="translate(116,50)" class="ic" style="animation-delay:.10s"><rect width="48" height="48" rx="10" fill="#3178c6" fill-opacity=".12" stroke="#3178c6" stroke-opacity=".4" stroke-width="1"/><text x="24" y="31" class="t" fill="#3178c6">TS</text></g>
  <text x="140" y="114" class="lbl">TypeScript</text>
  <g transform="translate(190,50)" class="ic" style="animation-delay:.15s"><rect width="48" height="48" rx="10" fill="#61DAFB" fill-opacity=".12" stroke="#61DAFB" stroke-opacity=".4" stroke-width="1"/><text x="24" y="31" class="t" fill="#61DAFB">React</text></g>
